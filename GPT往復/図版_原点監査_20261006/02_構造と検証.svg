<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="790" viewBox="0 0 1530 790"><g font-family="Yu Gothic,Meiryo,sans-serif">
<rect x="0" y="0" width="1530" height="790" rx="12" fill="#eef3f6"/>
<text x="40" y="60" font-size="35" fill="#17354a" font-weight="700">雪と鉱物粒床：見た目の結晶より、接点と空隙を確認する</text>
<text x="42" y="102" font-size="23" fill="#203d52" font-weight="400">模式図。実粒・顕微鏡・X線CTの観察像ではない。</text>
<rect x="30" y="135" width="460" height="560" rx="12" fill="white"/>
<text x="50" y="181" font-size="25" fill="#17354a" font-weight="700">目標：新雪を圧雪した雪</text>
<rect x="50" y="212" width="420" height="241" rx="12" fill="#dff0f7"/>
<text x="50" y="497" font-size="21" fill="#203d52" font-weight="400">氷の粒と細い接点の多孔構造</text>
<text x="50" y="542" font-size="21" fill="#203d52" font-weight="400">局所変形・接点の破壊と解放</text>
<text x="50" y="587" font-size="21" fill="#203d52" font-weight="400">板の滑りとエッジ支持を両立</text>
<text x="50" y="632" font-size="21" fill="#203d52" font-weight="400">実際の目標雪を測って基準にする</text>
<rect x="535" y="135" width="460" height="560" rx="12" fill="white"/>
<text x="555" y="181" font-size="25" fill="#17354a" font-weight="700">現行：結合した鉱物粒床</text>
<rect x="555" y="212" width="420" height="241" rx="12" fill="#e6e5df"/>
<text x="555" y="497" font-size="21" fill="#203d52" font-weight="400">充実した寒水石＋被膜／析出接点</text>
<text x="555" y="542" font-size="21" fill="#203d52" font-weight="400">乾燥密度は模型で約1,680kg/m³</text>
<text x="555" y="587" font-size="21" fill="#203d52" font-weight="400">接点・湿潤摩擦・切削感は未実測</text>
<text x="555" y="632" font-size="21" fill="#203d52" font-weight="400">「雪状構造が完成」とは言えない</text>
<rect x="1040" y="135" width="460" height="560" rx="12" fill="white"/>
<text x="1060" y="181" font-size="25" fill="#17354a" font-weight="700">探索案：軽い多孔・分岐粒</text>
<rect x="1060" y="212" width="420" height="241" rx="12" fill="#e4f1e6"/>
<text x="1060" y="497" font-size="21" fill="#203d52" font-weight="400">粒の内部と形状から設計し直す</text>
<text x="1060" y="542" font-size="21" fill="#203d52" font-weight="400">支持・解放・再接続を調整</text>
<text x="1060" y="587" font-size="21" fill="#203d52" font-weight="400">50℃・摩耗・濡れ・滑りを別検証</text>
<text x="1060" y="632" font-size="21" fill="#203d52" font-weight="400">未製作。雪の代替として未実証</text>
