<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24536e"/></marker><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#17394d} .title{font-size:35px;font-weight:700}.h{font-size:27px;font-weight:700}.t{font-size:23px}.s{font-size:20px}.muted{fill:#597484}.line{fill:none;stroke:#24536e;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1600" height="1050" fill="#f3f7fa"/><text x="60" y="65" class="title">着脱・支持・滑走を分ける開放粒 — 発明候補の比較</text><text x="60" y="106" class="t muted">設計仮説の説明図。三次元CAD・測定結果・製造図面ではありません。</text><rect x="50" y="140" width="1500" height="480" rx="20" fill="white"/><text x="85" y="190" class="h">主案：薄い入口を通し、内側の短い受けで支える</text><text x="90" y="235" class="s muted">粒全体の外径0.4〜0.6mmを探索。下図は圧縮側の接点を拡大した概念断面（縮尺なし）。</text><g transform="translate(90,280)"><rect x="0" y="0" width="410" height="285" rx="15" fill="#edf5fa"/><text x="20" y="38" class="h">① 入る</text><path d="M45 198 L45 88 Q45 65 72 65 L123 65 M45 198 L285 198 Q306 198 306 170 L306 118" fill="none" stroke="#527f9c" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/><path d="M123 65 Q176 65 192 132" fill="none" stroke="#27a17e" stroke-width="12" stroke-linecap="round"/><rect x="252" y="46" width="48" height="44" rx="15" fill="#e2a34b"/><path d="M271 12 Q230 5 212 51" class="line"/><text x="18" y="247" class="s">緑：たわむ入口／橙：隣の粒のリブ</text><text x="18" y="274" class="s muted">曲げたまま保持する力に頼らない</text></g><path d="M518 411 L558 411" class="line"/><g transform="translate(578,280)"><rect width="410" height="285" rx="15" fill="#edf5fa"/><text x="20" y="38" class="h">② 支える</text><path d="M45 198 L45 88 Q45 65 72 65 L123 65 M45 198 L285 198 Q306 198 306 170 L306 118" fill="none" stroke="#527f9c" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/><path d="M123 65 Q180 65 197 99" fill="none" stroke="#27a17e" stroke-width="12" stroke-linecap="round"/><rect x="227" y="131" width="48" height="44" rx="15" fill="#e2a34b"/><rect x="236" y="174" width="42" height="18" rx="5" fill="#194f74"/><path d="M252 98 L252 163" class="line"/><text x="18" y="247" class="s">受けを根元へ近づけ、荷重を渡す</text><text x="18" y="274" class="s muted">偏心5→50µmで計算効果が低下</text></g><path d="M1008 411 L1048 411" class="line"/><g transform="translate(1068,280)"><rect width="410" height="285" rx="15" fill="#edf5fa"/><text x="20" y="38" class="h">③ 回転して外れる</text><path d="M45 198 L45 88 Q45 65 72 65 L123 65 M45 198 L285 198 Q306 198 306 170 L306 118" fill="none" stroke="#527f9c" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/><path d="M123 65 Q180 65 197 99" fill="none" stroke="#27a17e" stroke-width="12" stroke-linecap="round"/><rect x="203" y="108" width="48" height="44" rx="15" transform="rotate(-35 227 130)" fill="#e2a34b"/><path d="M282 167 Q187 200 203 101" class="line"/><text x="18" y="247" class="s">粒を壊さず、逃げ側へ再配置する</text><text x="18" y="274" class="s muted">台風の揺動でも外れないか要検証</text></g><rect x="50" y="644" width="730" height="230" rx="18" fill="white"/><text x="85" y="690" class="h">対抗案を残す</text><text x="85" y="736" class="t">C：留め具なしの開放鞍形・絡み合い</text><text x="85" y="778" class="t">D：強靱なゲルを接点に限定</text><text x="85" y="825" class="s muted">保持不足／回復が遅い／成形が高価なら経路を切替</text><rect x="810" y="644" width="740" height="230" rx="18" fill="#e9f4ef"/><text x="845" y="690" class="h">強さと同時に守る設計条件</text><text x="845" y="736" class="t">500円/kgなら密度上限 約158kg/m³ *</text><text x="845" y="778" class="t">60分閉鎖で最後の区間の回復 約11分 *</text><text x="845" y="825" class="s">表面50℃・全深度機能・300mm局所削れ代</text><text x="60" y="925" class="s muted">* 従来の仮の需要・維持費・寸法・機械速度による条件付き計算。見積り／実機性能ではありません。</text><text x="60" y="968" class="t">冬の凍着・排水、暴風と地盤接続、粉じん・擦過・板の傷は別の必須判定。</text><text x="60" y="1011" class="s muted">2026-10-07 / Codex / jinkoukousetu-docs — 90％超の現物成功を示す図ではありません。</text></svg>