   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(116.295775 83.170906)">1 | On slope</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(93.79304 96.373914)">Redistribute + drain</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(72.028509 109.576922)">Add qualified reserve grains</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(351.227923 83.170906)">2 | Removed batch</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(328.725188 96.373914)">Check shape + wet friction</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(319.447376 109.576922)">Do not assume perfect sorting</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(602.287102 83.170906)">3 | Off-slope factory</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(591.628274 96.373914)">Renew contact material</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(591.562961 109.576922)">Reject broken skeletons</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(605.399758 252.370906)">4 | Re-qualification</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(583.356789 265.573914)">50°C + rain + repeat wear</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(577.767414 278.776922)">Edge force and short release</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(347.31347 252.370906)">5 | Qualified reserve</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(328.854095 265.573914)">Return within usable depth</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(328.630657 278.776922)">Track mass and actual cost</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(113.710775 252.346414)">Concept H55</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(80.061087 265.549422)">Mass loss needs material</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(55.717572 278.75243)">Light alone does not refill grooves</text>
   </g>
