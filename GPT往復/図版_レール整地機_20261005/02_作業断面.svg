<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><style>text{font-family:Meiryo,sans-serif}</style><rect x="0" y="0" width="1440" height="1020" fill="#f6f8fb" stroke="none" rx="0"/><rect x="0" y="0" width="1440" height="112" fill="#142f45" stroke="none" rx="0"/><text x="36" y="48" font-size="29" fill="white" font-weight="700">回収・配材・振動・仕上げの具体構成</text><text x="36" y="86" font-size="17" fill="#c8ddea" font-weight="400">ローラー20分割、接触長0.1m仮定。50kPaで総押付力100kN。圧力は試験で校正。</text><rect x="44" y="140" width="1352" height="810" fill="white" stroke="#cfdae3" rx="12"/><text x="72" y="185" font-size="24" fill="#142f45" font-weight="700">縦断面  座標を斜面に合わせて表示</text><text x="72" y="216" font-size="18" fill="#203448" font-weight="400">右が山側。傾斜30°そのものは省略。作業部は材料に追従し、主荷重は左右レールで受ける。</text><rect x="105" y="559" width="1210" height="82" fill="#e2ece6" stroke="none" rx="0"/><rect x="105" y="641" width="1210" height="40" fill="#c3d7d1" stroke="none" rx="0"/><rect x="105" y="681" width="1210" height="74" fill="#b2c4cd" stroke="none" rx="0"/><rect x="105" y="755" width="1210" height="70" fill="#c9b89d" stroke="none" rx="0"/><text x="140" y="610" font-size="20" fill="#203448" font-weight="400">表層材料 0.30m仮定（0.45m・1.50mも費用感度）</text><text x="140" y="669" font-size="18" fill="#203448" font-weight="400">フィルター：粒度と保持・排水性能で選ぶ</text><text x="140" y="723" font-size="20" fill="#203448" font-weight="400">排水砕石 0.20m仮定 → 区画ごとに横断集水</text><text x="140" y="802" font-size="20" fill="#203448" font-weight="400">整形地盤：地下水・支持力・斜面全体の安定を確認</text><rect x="170" y="338" width="1010" height="38" fill="#345b79" stroke="none" rx="0"/><text x="420" y="366" font-size="20" fill="white" font-weight="700">側方レールに支持された横断トラス</text><line x1="270" y1="376" x2="270" y2="485" stroke="#345b79" stroke-width="6" stroke-dasharray=""/><line x1="430" y1="376" x2="430" y2="485" stroke="#345b79" stroke-width="6" stroke-dasharray=""/><line x1="640" y1="376" x2="640" y2="485" stroke="#345b79" stroke-width="6" stroke-dasharray=""/><line x1="820" y1="376" x2="820" y2="485" stroke="#345b79" stroke-width="6" stroke-dasharray=""/><line x1="1050" y1="376" x2="1050" y2="485" stroke="#345b79" stroke-width="6" stroke-dasharray=""/><line x1="1100" y1="476" x2="1150" y2="565" stroke="#b76436" stroke-width="12" stroke-dasharray=""/><path d="M 1108 558 L 1260 558 L 1180 500 Z" fill="#edc896"/><rect x="940" y="482" width="26" height="55" fill="#d39238" stroke="none" rx="0"/><line x1="925" y1="535" x2="980" y2="535" stroke="#d39238" stroke-width="4" stroke-dasharray=""/><circle cx="820" cy="523" r="40" fill="#8ab4c7"/><text x="802" y="531" font-size="25" fill="#203448" font-weight="400">↔</text><circle cx="640" cy="511" r="48" fill="#91c9c7"/><rect x="382" y="548" width="95" height="13" fill="#536e82" stroke="none" rx="0"/><line x1="430" y1="485" x2="430" y2="548" stroke="#536e82" stroke-width="4" stroke-dasharray=""/><rect x="247" y="469" width="47" height="22" fill="#007f80" stroke="none" rx="0"/><line x1="270" y1="491" x2="270" y2="552" stroke="#007f80" stroke-width="2" stroke-dasharray="6 4"/><text x="1002" y="434" font-size="20" fill="#a45427" font-weight="700">①前刃で保持</text><text x="985" y="461" font-size="17" fill="#203448" font-weight="400">最大2m³を仮定</text><text x="901" y="305" font-size="20" fill="#9a651b" font-weight="700">②可変ゲート</text><line x1="950" y1="312" x2="950" y2="472" stroke="#d39238" stroke-width="2" stroke-dasharray=""/><text x="725" y="434" font-size="20" fill="#345b79" font-weight="700">③横配り</text><text x="558" y="305" font-size="20" fill="#007f80" font-weight="700">④分割ローラー</text><line x1="642" y1="312" x2="642" y2="455" stroke="#007f80" stroke-width="2" stroke-dasharray=""/><text x="350" y="434" font-size="20" fill="#345b79" font-weight="700">⑤スカート</text><text x="180" y="305" font-size="20" fill="#007f80" font-weight="700">⑥後方高さ計測</text><line x1="268" y1="312" x2="268" y2="461" stroke="#007f80" stroke-width="2" stroke-dasharray=""/><line x1="980" y1="250" x2="1220" y2="250" stroke="#007f80" stroke-width="4" stroke-dasharray=""/><path d="M1208 242 L1220 250 L1208 258" fill="none" stroke="#007f80" stroke-width="4"/><text x="992" y="280" font-size="20" fill="#007f80" font-weight="700">山側へ牽引</text><text x="75" y="870" font-size="20" fill="#203448" font-weight="400">回収モード：ゲートを絞り、ローラーを上げる。仕上げモード：必要量を配り、荷重と振動を制御する。</text><text x="75" y="910" font-size="20" fill="#9a651b" font-weight="400">表面高さ・粒子の健全性・硬さ・排水を別々に確認する。締め固め率最大を目標にしない。</text><text x="36" y="996" font-size="16" fill="#52697d" font-weight="400">2026-10-05  Codex  |  概念配置・比較用寸法。製作図ではなく、地盤・構造・機能試験で確定する。</text></svg>