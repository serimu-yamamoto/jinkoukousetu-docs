<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><style>text{font-family:Meiryo,sans-serif}</style><rect x="0" y="0" width="1440" height="1020" fill="#f6f8fb" stroke="none" rx="0"/><rect x="0" y="0" width="1440" height="112" fill="#142f45" stroke="none" rx="0"/><text x="36" y="48" font-size="29" fill="white" font-weight="700">60分閉鎖に対応する配置の比較</text><text x="36" y="86" font-size="17" fill="#c8ddea" font-weight="400">依頼者指定：4〜5時間ごとに整地、閉鎖は60分程度。時間は計算値で実機保証ではない。</text><rect x="44" y="140" width="1352" height="340" fill="white" stroke="#cfdae3" rx="12"/><text x="72" y="183" font-size="25" fill="#142f45" font-weight="700">D5  基準案：200m × 5台を同時に整地</text><rect x="90" y="228" width="235" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="175" y="240" width="24" height="86" fill="#345b79" stroke="none" rx="0"/><text x="136" y="213" font-size="18" fill="#203448" font-weight="400">区間1  200m</text><text x="137" y="372" font-size="18" fill="#203448" font-weight="400">機体12t / 1台</text><rect x="343" y="228" width="235" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="428" y="240" width="24" height="86" fill="#345b79" stroke="none" rx="0"/><text x="389" y="213" font-size="18" fill="#203448" font-weight="400">区間2  200m</text><text x="390" y="372" font-size="18" fill="#203448" font-weight="400">機体12t / 1台</text><rect x="596" y="228" width="235" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="681" y="240" width="24" height="86" fill="#345b79" stroke="none" rx="0"/><text x="642" y="213" font-size="18" fill="#203448" font-weight="400">区間3  200m</text><text x="643" y="372" font-size="18" fill="#203448" font-weight="400">機体12t / 1台</text><rect x="849" y="228" width="235" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="934" y="240" width="24" height="86" fill="#345b79" stroke="none" rx="0"/><text x="895" y="213" font-size="18" fill="#203448" font-weight="400">区間4  200m</text><text x="896" y="372" font-size="18" fill="#203448" font-weight="400">機体12t / 1台</text><rect x="1102" y="228" width="235" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="1187" y="240" width="24" height="86" fill="#345b79" stroke="none" rx="0"/><text x="1148" y="213" font-size="18" fill="#203448" font-weight="400">区間5  200m</text><text x="1149" y="372" font-size="18" fill="#203448" font-weight="400">機体12t / 1台</text><text x="72" y="413" font-size="23" fill="#007f80" font-weight="700">作業25.6分 ＋ 空戻り11.1分 ＋ 展開・格納・確認15分 ＝ 51.8分</text><text x="72" y="452" font-size="19" fill="#9a651b" font-weight="400">残り約8.2分。硬化・再結合・追加検査が長ければ速度または運用の再設計が必要。</text><rect x="44" y="510" width="1352" height="340" fill="white" stroke="#cfdae3" rx="12"/><text x="72" y="553" font-size="25" fill="#142f45" font-weight="700">D3  比較案：約333m × 3台、上下どちら向きも仕上げる</text><rect x="90" y="598" width="405" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="262" y="610" width="34" height="86" fill="#345b79" stroke="none" rx="0"/><text x="216" y="582" font-size="18" fill="#203448" font-weight="400">区間1  約333m</text><text x="221" y="745" font-size="18" fill="#203448" font-weight="400">機体16t / 1台</text><rect x="513" y="598" width="405" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="685" y="610" width="34" height="86" fill="#345b79" stroke="none" rx="0"/><text x="639" y="582" font-size="18" fill="#203448" font-weight="400">区間2  約333m</text><text x="644" y="745" font-size="18" fill="#203448" font-weight="400">機体16t / 1台</text><rect x="936" y="598" width="405" height="110" fill="#e8f5f4" stroke="#74aaae" rx="5"/><rect x="1108" y="610" width="34" height="86" fill="#345b79" stroke="none" rx="0"/><text x="1062" y="582" font-size="18" fill="#203448" font-weight="400">区間3  約333m</text><text x="1067" y="745" font-size="18" fill="#203448" font-weight="400">機体16t / 1台</text><text x="72" y="783" font-size="23" fill="#007f80" font-weight="700">作業42.7分 ＋ 展開・格納・確認15分 ＝ 57.7分（空戻りなし）</text><text x="72" y="825" font-size="19" fill="#9a651b" font-weight="400">上下両方向の品質・制動・端部収納を実証する。残り約2.3分で余裕が小さい。</text><text x="72" y="901" font-size="20" fill="#203448" font-weight="400">両案：幅20m、作業0.2m/s、稼働率65%の仮定。全機の同時運転と側方収納を想定。</text><text x="72" y="936" font-size="20" fill="#203448" font-weight="400">昼は短距離の均しを主用途とし、大量材料を山麓から戻す運搬は別時間・別設備で扱う。</text><text x="36" y="996" font-size="16" fill="#52697d" font-weight="400">2026-10-05  Codex  |  概念配置・比較用寸法。製作図ではなく、地盤・構造・機能試験で確定する。</text></svg>