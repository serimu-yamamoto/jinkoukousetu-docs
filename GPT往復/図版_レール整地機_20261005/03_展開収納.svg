<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><style>text{font-family:Meiryo,sans-serif}</style><rect x="0" y="0" width="1440" height="1020" fill="#f6f8fb" stroke="none" rx="0"/><rect x="0" y="0" width="1440" height="112" fill="#142f45" stroke="none" rx="0"/><text x="36" y="48" font-size="29" fill="white" font-weight="700">展開と収納  二つの方式の比較</text><text x="36" y="86" font-size="17" fill="#c8ddea" font-weight="400">日常の収納方法を先に決めると、専用基礎・油圧機構・保守費の見積りが明確になる。</text><rect x="44" y="140" width="1352" height="252" fill="white" stroke="#cfdae3" rx="12"/><text x="72" y="178" font-size="24" fill="#142f45" font-weight="700">A  全幅で山頂の退避場へ収納  基準案</text><rect x="220" y="207" width="720" height="92" fill="#e8f5f4" stroke="#74aaae" rx="0"/><rect x="227" y="228" width="706" height="35" fill="#345b79" stroke="none" rx="0"/><text x="358" y="253" font-size="20" fill="white" font-weight="700">展開状態のまま、コース外へ移動</text><text x="970" y="240" font-size="19" fill="#203448" font-weight="400">必要な仮面積</text><text x="970" y="274" font-size="25" fill="#007f80" font-weight="700">26m × 8m</text><text x="72" y="337" font-size="20" fill="#203448" font-weight="400">毎日の折畳み・中央接合を減らせる。退避場を確保できる場合の費用比較の基準にする。</text><rect x="44" y="414" width="1352" height="518" fill="white" stroke="#cfdae3" rx="12"/><text x="72" y="455" font-size="24" fill="#142f45" font-weight="700">B  左右へ折畳む  ユーザー案の具体化</text><text x="80" y="500" font-size="20" fill="#007f80" font-weight="700">1  整地終了・展開状態</text><rect x="80" y="520" width="390" height="240" fill="#f6f8fb" stroke="#cfdae3" rx="6"/><line x1="130" y1="540" x2="130" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><line x1="420" y1="540" x2="420" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><line x1="130" y1="626" x2="420" y2="626" stroke="#345b79" stroke-width="16" stroke-dasharray=""/><circle cx="275" cy="626" r="10" fill="#d39238"/><text x="156" y="688" font-size="17" fill="#203448" font-weight="400">11m＋中央ロック＋11m</text><text x="520" y="500" font-size="20" fill="#007f80" font-weight="700">2  中央接合を解除</text><rect x="520" y="520" width="390" height="240" fill="#f6f8fb" stroke="#cfdae3" rx="6"/><line x1="570" y1="540" x2="570" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><line x1="860" y1="540" x2="860" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><line x1="570" y1="626" x2="660" y2="570" stroke="#345b79" stroke-width="14" stroke-dasharray=""/><line x1="660" y1="570" x2="707" y2="620" stroke="#345b79" stroke-width="14" stroke-dasharray=""/><line x1="860" y1="626" x2="770" y2="570" stroke="#345b79" stroke-width="14" stroke-dasharray=""/><line x1="770" y1="570" x2="724" y2="620" stroke="#345b79" stroke-width="14" stroke-dasharray=""/><text x="578" y="688" font-size="17" fill="#203448" font-weight="400">各半分を2節化（約5.5m）</text><text x="960" y="500" font-size="20" fill="#007f80" font-weight="700">3  側方の格納台へ</text><rect x="960" y="520" width="390" height="240" fill="#f6f8fb" stroke="#cfdae3" rx="6"/><line x1="1010" y1="540" x2="1010" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><line x1="1300" y1="540" x2="1300" y2="742" stroke="#58758c" stroke-width="5" stroke-dasharray=""/><rect x="980" y="546" width="55" height="145" fill="#dbe9f2" stroke="#345b79" rx="0"/><rect x="1275" y="546" width="55" height="145" fill="#dbe9f2" stroke="#345b79" rx="0"/><line x1="995" y1="565" x2="995" y2="673" stroke="#345b79" stroke-width="13" stroke-dasharray=""/><line x1="1019" y1="565" x2="1019" y2="673" stroke="#345b79" stroke-width="13" stroke-dasharray=""/><line x1="1289" y1="565" x2="1289" y2="673" stroke="#345b79" stroke-width="13" stroke-dasharray=""/><line x1="1315" y1="565" x2="1315" y2="673" stroke="#345b79" stroke-width="13" stroke-dasharray=""/><text x="1050" y="717" font-size="17" fill="#203448" font-weight="400">有効滑走幅を開放</text><text x="72" y="809" font-size="20" fill="#9a651b" font-weight="700">折畳み中は、支え索・展開マスト・機械ロック・専用基礎で荷重を受ける。</text><text x="72" y="845" font-size="19" fill="#203448" font-weight="400">片側6t・重心5.5mなら根元曲げ約324kN·m。油圧シリンダだけで保持する構成にしない。</text><text x="72" y="886" font-size="19" fill="#203448" font-weight="400">格納枠は両側各3m × 8mの仮案。動作軌跡・風荷重・片側故障を設計し、試験後に採用する。</text><text x="36" y="996" font-size="16" fill="#52697d" font-weight="400">2026-10-05  Codex  |  概念配置・比較用寸法。製作図ではなく、地盤・構造・機能試験で確定する。</text></svg>