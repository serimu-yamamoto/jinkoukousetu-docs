<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><style>text{font-family:Meiryo,sans-serif}</style><rect x="0" y="0" width="1440" height="1020" fill="#f6f8fb" stroke="none" rx="0"/><rect x="0" y="0" width="1440" height="112" fill="#142f45" stroke="none" rx="0"/><text x="36" y="48" font-size="29" fill="white" font-weight="700">側方レール牽引式整地機  全体配置</text><text x="36" y="86" font-size="17" fill="#c8ddea" font-weight="400">仮定：コース 1,000m × 20m・最大30° ／ 小規模実証は100m × 6m</text><rect x="44" y="140" width="836" height="820" fill="white" stroke="#cfdae3" rx="12"/><rect x="904" y="140" width="492" height="820" fill="white" stroke="#cfdae3" rx="12"/><text x="70" y="180" font-size="24" fill="#142f45" font-weight="700">平面配置  本設 F1000</text><rect x="278" y="244" width="370" height="590" fill="#e8f5f4" stroke="none" rx="0"/><rect x="245" y="244" width="18" height="590" fill="#516e82" stroke="none" rx="0"/><rect x="663" y="244" width="18" height="590" fill="#516e82" stroke="none" rx="0"/><line x1="234" y1="248" x2="234" y2="830" stroke="#d39238" stroke-width="4" stroke-dasharray=""/><line x1="690" y1="248" x2="690" y2="830" stroke="#d39238" stroke-width="4" stroke-dasharray=""/><rect x="200" y="202" width="145" height="34" fill="#d6e4ed" stroke="#516e82" rx="0"/><rect x="580" y="202" width="145" height="34" fill="#d6e4ed" stroke="#516e82" rx="0"/><text x="208" y="225" font-size="16" fill="#203448" font-weight="400">左牽引＋収納</text><text x="588" y="225" font-size="16" fill="#203448" font-weight="400">右牽引＋収納</text><text x="354" y="226" font-size="18" fill="#007f80" font-weight="700">山頂 受電・制御</text><line x1="282" y1="300" x2="644" y2="300" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><line x1="282" y1="390" x2="644" y2="390" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><line x1="282" y1="480" x2="644" y2="480" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><line x1="282" y1="570" x2="644" y2="570" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><line x1="282" y1="660" x2="644" y2="660" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><line x1="282" y1="750" x2="644" y2="750" stroke="#74aaae" stroke-width="2" stroke-dasharray="8 5"/><rect x="244" y="480" width="436" height="70" fill="#cfdeea" stroke="#345b79" rx="8"/><text x="320" y="510" font-size="19" fill="#142f45" font-weight="700">横断トラス  支点間 22m</text><text x="344" y="537" font-size="18" fill="#203448" font-weight="400">作業部 20分割 × 1m</text><line x1="460" y1="453" x2="460" y2="388" stroke="#007f80" stroke-width="4" stroke-dasharray=""/><path d="M453 400 L460 388 L467 400" fill="none" stroke="#007f80" stroke-width="4"/><text x="494" y="429" font-size="18" fill="#007f80" font-weight="400">作業方向</text><text x="287" y="730" font-size="22" fill="#007f80" font-weight="700">有効滑走幅 20m</text><line x1="283" y1="750" x2="645" y2="750" stroke="#007f80" stroke-width="2" stroke-dasharray=""/><line x1="283" y1="742" x2="283" y2="758" stroke="#58758c" stroke-width="3" stroke-dasharray=""/><line x1="645" y1="742" x2="645" y2="758" stroke="#58758c" stroke-width="3" stroke-dasharray=""/><text x="78" y="380" font-size="18" fill="#203448" font-weight="400">斜面実長</text><text x="78" y="410" font-size="24" fill="#142f45" font-weight="700">1,000m</text><text x="707" y="583" font-size="17" fill="#203448" font-weight="400">両側索は</text><text x="707" y="610" font-size="17" fill="#203448" font-weight="400">営業範囲外</text><text x="707" y="637" font-size="17" fill="#203448" font-weight="400">の保護溝内</text><rect x="280" y="851" width="365" height="72" fill="#f9e7c8" stroke="#c89338" rx="8"/><text x="301" y="879" font-size="19" fill="#203448" font-weight="400">山麓 回収槽・分級・積込</text><text x="301" y="907" font-size="16" fill="#203448" font-weight="400">素材100m³の仮枠／雨水は排出</text><text x="70" y="946" font-size="17" fill="#203448" font-weight="400">幅方向：滑走20m＋側方作業帯3m×2 ＝ 約26mの用地を仮定</text><text x="930" y="180" font-size="24" fill="#142f45" font-weight="700">数量と能力の対応</text><text x="930" y="227" font-size="19" fill="#007f80" font-weight="700">01  レール・支持</text><text x="930" y="257" font-size="18" fill="#203448" font-weight="400">両側2,000m、購入2,100m</text><text x="930" y="283" font-size="17" fill="#203448" font-weight="400">5m間隔の基礎 402箇所</text><text x="930" y="342" font-size="19" fill="#007f80" font-weight="700">02  駆動・索</text><text x="930" y="372" font-size="18" fill="#203448" font-weight="400">125kN級 × 2系統</text><text x="930" y="398" font-size="17" fill="#203448" font-weight="400">34mm候補 × 1,100m × 2本</text><text x="930" y="457" font-size="19" fill="#007f80" font-weight="700">03  作業部</text><text x="930" y="487" font-size="18" fill="#203448" font-weight="400">刃 → 配材ゲート → ローラー</text><text x="930" y="513" font-size="17" fill="#203448" font-weight="400">→ 仕上げスカート → 高さ計測</text><text x="930" y="572" font-size="19" fill="#007f80" font-weight="700">04  排水</text><text x="930" y="602" font-size="18" fill="#203448" font-weight="400">横断集排水 50mピッチの仮案</text><text x="930" y="628" font-size="17" fill="#203448" font-weight="400">設計降雨・地形で間隔と断面を確定</text><text x="930" y="687" font-size="19" fill="#007f80" font-weight="700">05  駐機</text><text x="930" y="717" font-size="18" fill="#203448" font-weight="400">全幅退避場 約26m × 8m</text><text x="930" y="743" font-size="17" fill="#203448" font-weight="400">折畳み時は両側の専用格納台へ</text><text x="930" y="802" font-size="19" fill="#007f80" font-weight="700">06  夜間の標準作業</text><text x="930" y="832" font-size="18" fill="#203448" font-weight="400">仕上げ約4.27h＋戻り0.93h</text><text x="930" y="858" font-size="17" fill="#203448" font-weight="400">点検・展開等0.75h → 約5.95h</text><text x="930" y="932" font-size="17" fill="#9a651b" font-weight="400">図は縮尺不同。索・排水は別の溝。</text><text x="36" y="996" font-size="16" fill="#52697d" font-weight="400">2026-10-05  Codex  |  概念配置・比較用寸法。製作図ではなく、地盤・構造・機能試験で確定する。</text></svg>